[package]
name = "photocraft-vision"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Foreground object masks from Apple's Vision framework (macOS 14+); finds nothing elsewhere"

# An isolated `unsafe` helper crate like `photocraft-tablet` (see AGENTS.md, Never crash): calling
# Vision and CoreVideo needs Objective-C and C interop. Only `src/macos.rs` allows `unsafe`;
# everything else is denied, and every other crate keeps the workspace's `unsafe_code = "forbid"`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

# Pinned exactly to the objc2 versions already in Cargo.lock (tablet, app-kit): review the diff
# before bumping.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSIndexSet", "NSObjCRuntime", "NSString"] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-vision = { version = "=0.3.2", default-features = false, features = ["std", "objc2-core-video", "VNRequest", "VNRequestHandler", "VNObservation", "VNGenerateForegroundInstanceMaskRequest"] }
